{% extends 'base.html' %}
{% block title %}Home{% endblock title %}
{% block body %}
 <form enctype="multipart/form-data" class="flex items-center space-x-6 text-gray-400 bg-gray-900 body-font p-8 pb-16 flex-col" method="POST" action="/">   
        <div class="shrink-0">
          <img class="h-16 w-16 object-cover rounded-full" src="https://source.unsplash.com/1600x600/?fruits" alt="Current profile photo" />
        </div>
        <label class="block">
          <span class="sr-only">Choose a photo</span>
          <input type="file" class="block w-full text-sm text-slate-500
            file:mr-4 file:py-2 file:px-4
            file:rounded-full file:border-0
            file:text-sm file:font-semibold
            file:bg-violet-50 file:text-violet-700
            hover:file:bg-violet-100
          " name="photoFile"/>
        </label>
        <label for="Option" class="block mb-2 text-sm font-medium dark:text-white my-4">Select an option</label>
        <a href="static/imgs/1.png" target="_blank" rel="noopener noreferrer" style="text-decoration: underline !important;">Download Generated Image</a>
<select id="Option" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg my-4 focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" name="Option">
  <option selected value="gray">Select a Option</option>
  <option value="gray">Gray Scale</option>
  <option value="blur">Blur</option>
  <option value="Dilate">Dilate</option>
  <option value="Erode">Erode</option>
</select>
<button type="submit" class="focus:outline-none text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 mb-2 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-900">Make Image</button>
</form>

{%endblock body%}
